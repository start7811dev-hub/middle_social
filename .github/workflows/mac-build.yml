name: mac-build
# Actions 탭 → mac-build → Run workflow 로 실행. 결과물(.dmg/.zip)은 Artifacts에서 내려받는다.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run mac:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: social-atlas-mac
          path: |
            release/*.dmg
            release/*.zip
